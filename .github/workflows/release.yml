# Publishes the release for the current SCRIPT_VERSION when its notes file
# (release-notes/v<version>.md) lands on main, or when run by hand from the
# Actions tab. Skips versions that are already released.
name: Release
on:
  push:
    branches: [main]
    paths: ['release-notes/v*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'SCRIPT_VERSION := "\K[0-9.]+' PerformanceCompanion.ahk)
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is already released"; exit 0; fi
          NOTES="release-notes/$TAG.md"
          [ -f "$NOTES" ] || { echo "No $NOTES, so $TAG isn't ready to release"; exit 0; }
          cp PerformanceCompanion.ahk "PerformanceCompanion-$VER.ahk"
          gh release create "$TAG" "PerformanceCompanion-$VER.ahk" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "$NOTES" --latest
